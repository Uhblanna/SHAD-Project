<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/public/js/auth-check.js"></script>
<title>SHAD Portal | Shopping</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/public/css/shad-base.css">
<link rel="stylesheet" href="/public/css/shopping.css">

<script src="/public/js/shopping.js" defer></script>

</head>
<body>

<header class="topbar">

    <div class="logo-wrap">
        <div class="logo-box"></div>
        <h1>SHAD Portal</h1>
        <nav>
            <span style="color:#ddd; font-weight:400;">|</span>
            <a href="/public/index.html">Home</a>
        </nav>
    </div>

    <nav>
        <a href="/public/dashboard.html">Dashboard</a>
        <a href="/public/students.html">Student Hub</a>
        <a href="/public/tools.html">Daily Tasks</a>
        <a href="/public/contact.html">Contact Staff</a>
        <a href="/public/issues.html">System Issues</a>
        <a href="/public/admin.html" style="color:#146ff8;font-weight:800;">Admin</a>
    </nav>

</header>


<section class="shopping-page">

    <div class="page-header">

        <div>
            <p class="mini-title">SUPPLY MANAGEMENT</p>
            <h2>Shopping Requests</h2>
            <p class="subtext">
                Keep a live running list of items needed for students, staff,
                events, and daily operations.
            </p>
        </div>

    </div>


    <div class="shopping-layout">

        <!-- LEFT SIDE -->
        <div class="list-card">

            <div class="card-head">
                <h3>Current Purchase List</h3>
                <span>0 Items Pending</span>
            </div>

            <div id="shoppingList"></div>

            <button id="savePurchasedBtn" class="save-btn">Remove Purchased Items</button>

        </div>


        <!-- RIGHT SIDE -->
        <div class="form-card">

            <h3>Add New Item</h3>

            <label>Item Name</label>
            <input type="text" id="itemNameInput" placeholder="Ex: Batteries">

            <label>Requested By</label>
            <input type="text" id="requestedByInput" placeholder="Ex: Sarah">

            <label>Reason for Request</label>
            <textarea id="reasonInput" placeholder="Why is this item needed?"></textarea>

            <label>Description</label>
            <textarea id="descriptionInput" placeholder="Any extra details (quantity, size, brand, etc.)..."></textarea>

            <label>Upload Picture</label>
            <input type="file" class="file-upload">

            <label class="priority-check">
                <input type="checkbox">
                Mark As Priority Item
            </label>

            <button>Add To List</button>

        </div>

    </div>

</section>

</body>
</html>
