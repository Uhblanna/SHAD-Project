<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAD Portal | Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public/css/reports.css">
<script src="/public/js/db.js"></script>
<script src="/public/js/reports.js"></script>
</head>
<body>
<header class="topbar">
    <div class="logo-wrap">
        <div class="logo-box"></div>
        <h1>SHAD Portal</h1>
        <nav><a href="/public/index.html">Home</a></nav>
    </div>
    <nav>
        <a href="/public/dashboard.html">Dashboard</a>
        <a href="/public/students.html">Students</a>
        <a href="/public/contact.html">Contact Staff</a>
        <a href="/public/issues.html">Report An Issue</a>
    </nav>
</header>

<section class="reports-page">
    <div class="page-header">
        <div>
            <p class="mini-title">STUDENT INCIDENT LOG</p>
            <h2>Reports &amp; Concerns</h2>
            <p class="subtext">Track attendance issues, behavioral concerns, wellness incidents, and follow-up notes.</p>
        </div>
    </div>

    <div class="report-layout">
        <!-- LEFT FORM -->
        <div class="report-card">
            <h3>Create New Report</h3>
            <label>Select Student</label>
            <select id="reportStudentSelect">
                <option value="">— Select a student —</option>
            </select>

            <label>Issue Type</label>
            <div class="checkbox-grid">
                <label class="check-item"><input type="checkbox" value="Attendance"> Attendance</label>
                <label class="check-item"><input type="checkbox" value="Late Arrival"> Late Arrival</label>
                <label class="check-item"><input type="checkbox" value="Missing Student"> Missing Student</label>
                <label class="check-item"><input type="checkbox" value="Behavior"> Behavior</label>
                <label class="check-item"><input type="checkbox" value="Wellness"> Wellness</label>
                <label class="check-item"><input type="checkbox" value="Medical"> Medical</label>
                <label class="check-item"><input type="checkbox" value="Conflict"> Conflict</label>
                <label class="check-item"><input type="checkbox" value="Other"> Other</label>
            </div>

            <label>Detailed Notes</label>
            <textarea id="reportNotes" placeholder="Explain the issue, timeline, staff involved, actions taken, and follow-up needed..."></textarea>

            <button class="submit-btn">Submit Report</button>
        </div>

        <!-- RIGHT SIDE -->
        <div class="recent-card">
            <h3>Recent Reports</h3>
            <div id="recentReportsList"></div>
        </div>
    </div>
</section>
</body>
</html>
