<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/public/js/auth-check.js"></script>
<title>SHAD Portal | System Issues</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/public/css/shad-base.css">
<link rel="stylesheet" href="/public/css/issues.css">

<script src="/public/js/issues.js" defer></script>

</head>
<body>

<header class="topbar">

    <div class="logo-wrap">
        <div class="logo-box"></div>
        <h1>SHAD Portal</h1>
        <nav>
            <span style="color:#ddd; font-weight:400;">|</span>
            <a href="/public/index.html">Home</a>
        </nav>
    </div>

    <nav>
        <a href="/public/dashboard.html">Dashboard</a>
        <a href="/public/students.html">Student Hub</a>
        <a href="/public/morning-rec-qr.html">Morning Rec</a>
        <a href="/public/contact.html">Contact Staff</a>
        <a href="/public/issues.html">System Issues</a>
        <a href="/public/admin.html" style="color:#146ff8;font-weight:800;">Admin</a>
    </nav>

</header>


<section class="issue-page">

    <div class="page-header">

        <div>
            <p class="mini-title">TECH SUPPORT</p>
            <h2>Report a System Issue</h2>
            <p class="subtext">
                Submit bugs, broken pages, loading errors, or unexpected system behaviour.
            </p>
        </div>

    </div>


    <div class="issue-layout">

        <!-- LEFT FORM -->
        <div class="issue-card">

            <h3>Submit New Issue</h3>

            <label>Your Name</label>
            <input id="issueName" type="text" placeholder="Full name">

            <label>Email Address</label>
            <input id="issueEmail" type="email" placeholder="you@example.com">

            <label>Phone Number</label>
            <input id="issuePhone" type="text" placeholder="Optional">

            <label>Issue Type</label>
            <select id="issueType">
                <option>Select issue type</option>
                <option>Login Problem</option>
                <option>Broken Page</option>
                <option>Attendance Error</option>
                <option>Student Data Error</option>
                <option>Slow Loading</option>
                <option>Other</option>
            </select>

            <label>Describe the Problem</label>
            <textarea id="issueDescription" placeholder="What happened? What page were you on? What did you expect to happen?"></textarea>

            <label>Upload Screenshot</label>
            <input type="file" class="file-upload">

            <label class="urgent-check">
                <input id="issueUrgent" type="checkbox">
                Mark as urgent issue
            </label>

            <button id="sendIssueBtn" type="button">Send Issue Report</button>

        </div>

        <!-- RIGHT SIDE -->
        <div class="system-card">

            <h3>System Error Queue</h3>

            <div id="issueQueue">
                <p>No issue tickets submitted yet.</p>
            </div>

        </div>

    </div>

</section>

</body>
</html>
