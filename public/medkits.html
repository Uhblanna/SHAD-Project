<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAD Portal | Med Kits</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/public/css/medkits.css">

<script src="/public/js/medkits.js"></script>

</head>
<body>

<header class="topbar">

    <div class="logo-wrap">
        <div class="logo-box"></div>
        <h1>SHAD Portal</h1>
        <nav>
            <a href="/public/index.html">Home</a>
        </nav>
    </div>

    <nav>
        <a href="/public/dashboard.html">Dashboard</a>
        <a href="/public/students.html">Students</a>
        <a href="/public/contact.html">Contact Staff</a>
        <a href="/public/issues.html">Report An Issue</a>
    </nav>
</header>

<section class="med-page">

    <div class="page-header">
        <div>
            <p class="mini-title">MEDICAL SUPPLY TRACKING</p>
            <h2>Med Kits & Med Packs</h2>
            <p class="subtext">
                Track who has each kit, where it is, whether it has been checked, and if anything is missing.
            </p>
        </div>
    </div>

    <div class="med-layout">

        <div class="kit-list-card">
            <div class="card-head">
                <h3>Current Med Kits</h3>
                <span id="kit-count">0 Kits</span>
            </div>

            <div id="kit-list"></div>
        </div>

        <div class="form-card">
            <h3>Add / Update Med Kit</h3>

            <label>Kit Name</label>
            <input type="text" id="kitName" placeholder="Example: Main Med Kit">

            <label>Assigned Staff</label>
            <input type="text" id="assignedStaff" placeholder="Example: Sarah Kim">

            <label>Current Location</label>
            <input type="text" id="location" placeholder="Example: Lecture Hall">

            <label>Status</label>
            <select id="status">
                <option value="Checked">Checked</option>
                <option value="Needs Restock">Needs Restock</option>
                <option value="Missing">Missing</option>
                <option value="In Use">In Use</option>
            </select>

            <label>Missing / Low Supplies</label>
            <textarea id="supplies" placeholder="Example: Bandages, gloves, ice packs..."></textarea>

            <label class="check-label">
                <input type="checkbox" id="checkedToday">
                Kit checked today
            </label>

            <button id="addKitBtn">Save Med Kit</button>
        </div>

    </div>

</section>



</body>
</html>
